    RoomJoined:
      type: object
      required: [member_token, member_id, expires_in_seconds, ws_path, descriptor]
      description: |
        A seat in the room. Open the room WebSocket at `ws_path` with `?member_token=<member_token>`
        (the access token never goes in a URL). A member who has not been heard from on the socket for
        20 s is dropped and must join again; until then the same token reconnects and is resynchronised.

        All messages are JSON objects with a `type`.

        Client to server:
        - `ping {t}`: clock sync and keep-alive; send one at least every 10 s. Answered with `pong {t, server_ms}`.
        - `play`, `pause`, `seek {position_ms}`: become the room state for everyone. `position_ms` is an integer of at least 0.
        - `buffering {on}`: this member's player is stalled (true) or has recovered (false).
        - `lock {on}`: host only. While locked, only the host's play, pause and seek apply.

        Server to client:
        - `pong {t, server_ms}`: to the sender only. `t` is echoed; `server_ms` is server epoch ms.
        - `state {playing, position_ms, as_of_ms, by, controls_locked}`: the room clock (see RoomState).
          `by` is the member who caused it, or null when the room did. A member more than 1000 ms from
          the room position seeks to it. Any `state` clears a `waiting` notice.
          In a room that plays one shared stream, every `state` also carries `stream_epoch` and
          `stream_start_ms` (see below); in other rooms the two fields are absent.
        - `members {members: RoomMember[]}`: sent whenever someone joins, leaves or starts or stops buffering.
        - `waiting {name}`: the room is paused for this member. It resumes when they recover or after 15 s.
        - `error {code, message}`: to the sender only, for a refused command: `controls_locked`,
          `host_only`, `live_no_seek`, `bad_message`.
        - `closed {reason}`: the last message before the server closes the socket: `expired`, `deleted`,
          `shutdown`, `silent`, `replaced`, `slow` (close code 4000), `unauthorized` (4401),
          `not_found`, `not_a_member` (4404).

        On connect the server sends `members`, then `state`, then `waiting` if the room is waiting.
        Closing the socket with code 1000 or 1001 leaves the room at once; any other end of the
        connection keeps the seat until the 20 s silence rule applies.

        One shared stream. A title from a source that limits its connections (or is always proxied)
        is played to the whole room from a single upstream: every member's `descriptor` is an HLS
        URL of their own onto the same stream, whatever their client, with `start_position_ms`
        (media time zero of the stream) and `stream_epoch` set. The stream uses one of the source's
        connections however many members watch, and is released when the last member leaves or the
        room closes. A seek restarts it at the new position before the seek's `state` is sent. That
        `state` carries the new `stream_epoch` and `stream_start_ms`: a client whose epoch differs
        reloads the same playlist URL (the descriptor's `url` does not change) and treats
        `stream_start_ms` as its new time zero; segments of the previous epoch answer 403. A seek to
        a position the running stream already starts at (positions are floored to 5 s) keeps the
        epoch, and the client seeks within what it is playing. The stream's audio is the room's
        `audio_track`, else the first member's preferred or default track; `audio_track` in the
        descriptor says which. Titles from other sources are resolved per member, and live channels
        share the proxy's upstream as any two viewers of a channel do: for both, `stream_epoch` is
        null and `state` carries neither field.

        Reloading after a seek. `state` is the whole signal; there is no separate message.
        - `state` carries `stream_epoch` (shared stream): compare it with the epoch the client is
          playing (the descriptor's, then the last `state`'s). Different: reload the playlist URL it
          already has and take `stream_start_ms` as media time zero, so the player position is
          `position_ms - stream_start_ms`. Same: seek inside what is playing.
        - `state` carries no `stream_epoch` (a library title each member plays for themselves): there
          is nothing to reload. The member's own stream covers the whole title; seek the player to
          `position_ms`. `state` alone suffices.
        - A live room has no position: `position_ms` is null and only `playing` applies.
        A client that lost its place (a player error, an expired stream URL, a reconnect after a
        missed `state`) asks GET /rooms/{code}/descriptor for its descriptor as it is now, or joins
        again with its `member_token`; neither changes its seat.
      properties:
        member_token: {type: string, description: "valid 2 h, for this room and member only"}
        member_id: {type: string}
        expires_in_seconds: {type: integer}
        ws_path: {type: string, description: "/api/v1/rooms/<code>/ws"}
        descriptor: { $ref: '#/components/schemas/PlaybackDescriptor' }

    SportsListing:
      type: object
      required: [id, sport, programme_id, title, start, stop, channel_id, channel_name, channel_number, source_name]
      properties:
        id: {type: string}
        sport: {type: string}
        programme_id: {type: string}
        title: {type: string}
        category: {type: string, nullable: true}
        start: {type: string, format: date-time}
        stop: {type: string, format: date-time}
        channel_id: {type: string}
        channel_name: {type: string}
        channel_number: {type: integer}
        source_name: {type: string}
    SportsPage:
      type: object
      required: [as_of, items, total, limit, offset, sports, coverage]
      properties:
        as_of: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/SportsListing'}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        sports:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: {type: string}
              count: {type: integer}
        coverage:
          type: object
          required: [eligible_channels, channels_with_current_schedule]
          properties:
            eligible_channels: {type: integer}
            channels_with_current_schedule: {type: integer}

    SportsEventFeed:
      type: object
      required: [channel_id, channel_name, source_id, source_name, programme_id, language_verified]
      properties:
        channel_id: {type: string}
        channel_name: {type: string}
        source_id: {type: string}
        source_name: {type: string}
        programme_id: {type: string}
        language: {type: string, nullable: true}
        language_verified: {type: boolean}
    SportsEvent:
      type: object
      required: [id, title, sport, start, stop, status, replay, live_evidence, grouping_evidence, feeds]
      properties:
        id: {type: string}
        title: {type: string}
        sport: {type: string}
        start: {type: string, format: date-time}
        stop: {type: string, format: date-time}
        status: {type: string, enum: [current, upcoming, ended]}
        replay: {type: boolean}
        live_evidence: {type: boolean}
        grouping_evidence: {type: string}
        feeds: {type: array, items: {$ref: '#/components/schemas/SportsEventFeed'}}
    SportsRecording:
      type: object
      required: [title_id, title, source_id, source_name, sport, originally_available_at, duration_ms, audio_languages, audio_verified, language_hint, kind, live]
      properties:
        title_id: {type: string, description: Exact source-scoped library ID; open title/audio chooser}
        title: {type: string}
        source_id: {type: string}
        source_name: {type: string}
        sport: {type: string}
        originally_available_at: {type: string, nullable: true, description: Original release date, never broadcast or recording time}
        duration_ms: {type: integer, nullable: true}
        audio_languages: {type: array, items: {type: string}}
        audio_verified: {type: boolean}
        language_hint: {type: string, nullable: true}
        kind: {type: string, enum: [library_video]}
        live: {type: boolean, enum: [false]}
    SportsRecordingsPage:
      type: object
      required: [items, total, limit, offset, truncated]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SportsRecording'}}
        total: {type: integer, description: Matching entries within the bounded scan; consult truncated}
        limit: {type: integer}
        offset: {type: integer}
        truncated: {type: boolean}
    SportsEventsPage:
      type: object
      required: [as_of, date, timezone, events, total, limit, offset, sports, coverage, truncated]
      properties:
        as_of: {type: string, format: date-time}
        date: {type: string}
        timezone: {type: string}
        events: {type: array, items: {$ref: '#/components/schemas/SportsEvent'}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        truncated: {type: boolean}
        sports:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: {type: string}
              count: {type: integer}
        coverage:
          type: object
          required: [eligible_channels, channels_with_sports_schedule]
          properties:
            eligible_channels: {type: integer}
            channels_with_sports_schedule: {type: integer}

paths:
  /auth/google/start:
    get:
      security: []
      summary: Begin Google sign-in (any Google account)
      parameters:
        - { name: return_to, in: query, schema: {type: string, default: /} }
        - { name: invite, in: query, schema: {type: string, maxLength: 64}, description: "Invite token from /invite/<token>; held server-side for the sign-in" }
      responses: { '303': { description: Redirect to Google } }
  /auth/google/complete:
    post:
      security: []
      description: >-
        Active user: tokens, with status "active". Unknown user in approval mode: status "pending"
        and a token good only for GET /auth/me. Owner PIN regime: PendingOwnerLogin.
      responses: { '200': { description: Google identity handoff, content: { application/json: { schema: { oneOf: [{allOf: [{$ref: '#/components/schemas/AuthTokens'}, {type: object, properties: {status: {type: string, enum: [active]}}}]}, {$ref: '#/components/schemas/PendingApproval'}, {$ref: '#/components/schemas/PendingOwnerLogin'}] } } } } }
  /auth/me:
    get:
      summary: The caller's user, role, effective permissions and limits
      description: >-
        The one call a user waiting for approval may make (every other answers 403 approval_pending).
        Also answers a user without remote.access away from the home network, where every other call is 403 remote_access_denied.
        Once approved, the response carries full tokens, once, and the pending token stops working.
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { description: "session_revoked | session_stale (refresh) | user_suspended | token_expired" }
  /auth/sessions:
    get:
      summary: The caller's signed-in devices
      parameters: [{ name: user_id, in: query, schema: {type: string}, description: Another user's sessions; needs users.manage }]
      responses: { '200': { description: live sessions, most recently seen first, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuthSession' } } } } } }
  /auth/sessions/{sid}:
    patch:
      summary: Relabel a device, or mark it a shared household device
      description: >-
        A label is its user's to change (anyone's with users.manage). shared_device needs users.manage,
        on one's own device too; marking records the caller as the device's owner, unmarking clears it.
      parameters: [{name: sid, in: path, required: true, schema: {type: string}}]
      requestBody: { content: { application/json: { schema: { type: object, properties: { shared_device: {type: boolean}, label: {type: string, maxLength: 128, description: empty clears it} } } } } }
      responses:
        '200': { description: the session as it now is, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        '403': { description: "forbidden (shared_device without users.manage) | owner_required" }
        '404': { description: not found }
    delete:
      summary: Sign a device out (one's own; anyone's with users.manage)
      parameters: [{name: sid, in: path, required: true, schema: {type: string}}]
      responses: { '204': { description: revoked; its next request answers 401 }, '404': { description: not found } }
  /auth/switchable:
    get:
      summary: "Who's watching? The users a shared device can be handed to"
      description: >-
        Active users whose role (or own override) has on_shared_devices, owners and family first,
        then by name. Only a shared-device session may ask.
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, required: [users], properties: { users: { type: array, items: { $ref: '#/components/schemas/SwitchableUser' } } } } } } }
        '403': { description: not_shared_device }
  /auth/switch:
    post:
      summary: Hand a shared device to another user
      description: >-
        Keeps the device's session and re-binds it to the target, with fresh tokens; the previous
        user's tokens for this device stop working. A target with a PIN needs it. A target with
        more access than the current user must have one. Switching to oneself changes nothing.
      requestBody: { content: { application/json: { schema: { type: object, required: [user_id], properties: { user_id: {type: string}, pin: {type: string, writeOnly: true, minLength: 4, maxLength: 8} } } } } }
      responses:
        '200': { description: switched, content: { application/json: { schema: { $ref: '#/components/schemas/Switched' } } } }
        '401': { description: "pin_required | pin_invalid" }
        '403': { description: not_shared_device }
        '404': { description: not a user this device can switch to }
        '409': { description: "pin_setup_required (the target has more access and no PIN) | switch_conflict (retry)" }
        '429': { description: Five wrong PINs for this target in 15 minutes; respect Retry-After }
  /auth/adult-unlock:
    post:
      summary: Open the adult category on this session for four hours
      description: Needs watch.adult and the caller's own PIN. Listings then honour include_adult=true.
      requestBody: { content: { application/json: { schema: { type: object, required: [pin], properties: { pin: {type: string, writeOnly: true, minLength: 4, maxLength: 8} } } } } }
      responses:
        '200': { description: unlocked, content: { application/json: { schema: { type: object, required: [adult_unlocked_until], properties: { adult_unlocked_until: {type: string, format: date-time} } } } } }
        '403': { description: "forbidden (missing watch.adult) | pin_invalid" }
        '409': { description: pin_setup_required }
        '429': { description: Attempt limit; respect Retry-After }
  /auth/adult-lock:
    post: { summary: Close the adult category on this session again, responses: { '204': { description: ok } } }
  /auth/owner-pin/start:
    post:
      requestBody: { content: { application/json: { schema: { type: object, required: [profile_id, action], properties: { profile_id: {type: string}, action: {type: string, enum: [login, profile_switch, admin]} } } } } }
      responses: { '200': { description: Session and target bound one-use challenge, content: { application/json: { schema: {$ref: '#/components/schemas/OwnerPinChallenge'} } } } }
  /auth/owner-pin/verify:
    post:
      requestBody: { content: { application/json: { schema: { type: object, required: [challenge_id, poll_token, pin], properties: { challenge_id: {type: string}, poll_token: {type: string, writeOnly: true}, pin: {type: string, writeOnly: true, minLength: 6, maxLength: 12} } } } } }
      responses: { '200': { description: Authorized login/switch or one-use target policy action, content: { application/json: { schema: {oneOf: [{$ref: '#/components/schemas/AuthTokens'}, {$ref: '#/components/schemas/OwnerActionProof'}]} } } }, '429': {description: Attempt limit; respect Retry-After} }
  /auth/owner-pin/cancel:
    post:
      requestBody: { content: { application/json: { schema: { type: object, required: [challenge_id, poll_token], properties: { challenge_id: {type: string}, poll_token: {type: string, writeOnly: true} } } } } }
      responses: { '204': {description: Challenge canceled} }
  /auth/owner-pin/setup-status:
    get:
      responses: { '200': { description: Setup grant available only after exact local VM approval, content: { application/json: { schema: {$ref: '#/components/schemas/OwnerPinSetupStatus'} } } } }
  /auth/owner-pin/setup:
    post:
      requestBody: { content: { application/json: { schema: { type: object, required: [grant_id, grant_secret, pin], properties: { grant_id: {type: string}, grant_secret: {type: string, writeOnly: true}, pin: {type: string, writeOnly: true, minLength: 6, maxLength: 12} } } } } }
      responses: { '200': { description: Consumes local approval, replaces PIN and invalidates older sessions, content: { application/json: { schema: {$ref: '#/components/schemas/AuthTokens'} } } } }
  /auth/owner-pin/recovery-status:
    get:
      responses: { '200': {description: Local VM approval required for replacement; old PIN remains valid, content: {application/json: {schema: {type: object, required: [configured, recovery_authorized, local_approval_required], properties: {configured: {type: boolean}, recovery_authorized: {type: boolean}, local_approval_required: {type: boolean}, recovery_request_id: {type: string}, grant_id: {type: string}, grant_secret: {type: string, description: Memory-only secret}, expires_in: {type: integer}}}}} } }
  /auth/owner-pin/recover:
    post:
      requestBody: { content: { application/json: { schema: { type: object, required: [grant_id, grant_secret, pin], properties: { grant_id: {type: string}, grant_secret: {type: string, writeOnly: true}, pin: {type: string, writeOnly: true, minLength: 6, maxLength: 12} } } } } }
      responses: { '200': { description: Consumes local recovery approval and revokes older sessions, content: { application/json: { schema: {$ref: '#/components/schemas/AuthTokens'} } } } }
  /auth/profile-switch:
    post:
      summary: Authenticated profile switch using existing credentials and server policy
      requestBody: { content: { application/json: { schema: { type: object, required: [profile_id], properties: { profile_id: {type: string}, pin: {type: string}, password: {type: string} } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } } }
  /profiles/{id}/content-policy:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: { '200': { description: Content policy (users.manage), content: { application/json: { schema: { $ref: '#/components/schemas/ContentPolicy' } } } } }
    put:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: X-Owner-Action, in: header, required: true, schema: {type: string}, description: One-use proof bound to current owner session and this target profile}]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ContentPolicyInput' } } } }
      responses: { '200': { description: Saved policy; target sessions invalidated, content: { application/json: { schema: { $ref: '#/components/schemas/ContentPolicy' } } } } }
  /auth/login:
    post:
      security: []
      summary: Profile login (password for admin, PIN for profiles)
      requestBody: { content: { application/json: { schema: { type: object, required: [profile_id], properties: { profile_id: {type: string}, pin: {type: string, nullable: true}, password: {type: string, nullable: true} } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } } }
  /auth/refresh:
    post: { security: [], requestBody: { content: { application/json: { schema: { type: object, properties: { refresh_token: {type: string} } } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } } } }
  /auth/device:
    post: { security: [], summary: TV starts pairing; shows user_code, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceCode' } } } } } }
  /auth/device/poll:
    post: { security: [], requestBody: { content: { application/json: { schema: { type: object, properties: { device_code: {type: string} } } } } }, responses: { '200': { description: approved, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }, '428': { description: pending } } }
  /auth/device/approve:
    post: { summary: Logged-in user approves a TV code (web), requestBody: { content: { application/json: { schema: { type: object, properties: { user_code: {type: string}, profile_id: {type: string}, shared_device: {type: boolean, default: false, description: "Pair it as a shared household device (Who's watching?). true needs users.manage"} } } } } }, responses: { '204': { description: ok }, '403': { description: forbidden (shared_device without users.manage) } } }

  /profiles:
    get: { security: [], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Profile' } } } } } } }
    post: { requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, responses: { '201': { description: created } } }
  /profiles/{id}:
    patch: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, responses: { '200': { description: ok } } }
    delete: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '204': { description: ok } } }
  /profiles/{id}/pin:
    put: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { type: object, properties: { pin: {type: string, nullable: true} } } } } }, responses: { '204': { description: ok } } }

  /profiles/{id}/home_layout:
    get: { summary: Per-profile Home row order / hidden rows, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/HomeLayout' } } } } } }
    put: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/HomeLayout' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/HomeLayout' } } } } } }

  /profiles/{id}/prefs:
    get: { summary: Free-form client prefs for a profile (recent searches, reduced motion…), parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: "JSON object ({} when unset)", content: { application/json: { schema: { $ref: '#/components/schemas/ClientPrefs' } } } } } }
    put: { summary: Replace the profile's client prefs (JSON object, max 16 KB serialized; 413 payload_too_large otherwise), parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientPrefs' } } } }, responses: { '200': { description: stored object, content: { application/json: { schema: { $ref: '#/components/schemas/ClientPrefs' } } } }, '413': { description: too large } } }

  /disclaimer:
    get: { security: [], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Disclaimer' } } } } } }
  /disclaimer/accept:
    post: { requestBody: { content: { application/json: { schema: { type: object, properties: { version: {type: string} } } } } }, responses: { '204': { description: ok } } }

  /sources:
    get: { responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Source' } } } } } } }
    post:
      description: Rejected with 412 if the disclaimer has not been accepted and type is xtream or m3u.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SourceCreate' } } } }
      responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }, '412': { description: disclaimer not accepted } }
  /sources/{id}:
    get: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } } } }
    patch: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SourceCreate' } } } }, responses: { '200': { description: ok } } }
    delete: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '204': { description: ok } } }
  /sources/{id}/sync:
    post: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '202': { description: accepted } } }
  /sources/{id}/test:
    post: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { ok: {type: boolean}, message: {type: string} } } } } } } }
  /sources/plex/pin:
    post: { summary: Start Plex PIN link, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PlexPin' } } } } } }
  /sources/plex/pin/{pin_id}:
    get: { summary: Poll; on success creates one Source per reachable server, parameters: [{name: pin_id, in: path, required: true, schema: {type: integer}}], responses: { '200': { description: linked, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Source' } } } } }, '428': { description: pending } } }
  /services/registry:
    get: { summary: Known hand-off services (netflix, hulu…) with provider ids and link support, responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ServiceInfo' } } } } } } }

  /home:
    get:
      summary: Home rows for the current profile (Continue Watching, On Now, Recently Added, Watchlist, Favorites, per-source rows)
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { hero: { type: array, items: { $ref: '#/components/schemas/Tile' } }, rows: { type: array, items: { $ref: '#/components/schemas/Row' } } } } } } } }
  /search:
    get:
      parameters:
        - { name: q, in: query, required: true, schema: {type: string} }
        - { name: kinds, in: query, schema: {type: string, description: "csv of MediaKind"} }
        - { name: limit, in: query, schema: {type: integer, default: 40} }
        - { name: language, in: query, schema: {type: string, description: "Omitted = profile languages; all = all; und = unknown."} }
        - { name: source_id, in: query, schema: {type: string} }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { results: {type: array, items: {$ref: '#/components/schemas/Tile'}}, metadata_available: {type: boolean}, discovery_note: {type: string}, play_here: { type: array, items: { $ref: '#/components/schemas/Tile' } }, open_in_app: { type: array, items: { $ref: '#/components/schemas/Tile' } }, channels: { type: array, items: { $ref: '#/components/schemas/Channel' } }, attribution: {type: string} } } } } } }
  /playback/buffer/lease:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BufferLeaseRequest'}}}}
      responses: {'200': {description: Owned viewer lease and actual window, content: {application/json: {schema: {$ref: '#/components/schemas/BufferLeaseResponse'}}}}}
  /playback/buffer/heartbeat:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BufferViewerRequest'}}}}
      responses: {'200': {description: Renewed viewer lease and actual window, content: {application/json: {schema: {$ref: '#/components/schemas/BufferWindow'}}}}}
  /playback/buffer/seek:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BufferSeekRequest'}}}}
      responses: {'200': {description: Authorized seek playlist and actual window, content: {application/json: {schema: {$ref: '#/components/schemas/BufferSeekResponse'}}}}}
  /playback/buffer/release:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BufferViewerRequest'}}}}
      responses: {'204': {description: Viewer released; final viewer stops the owned producer}}
  /playback/rewind:
    get:
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses: {'200': {description: Advertised provider archive window, content: {application/json: {schema: {$ref: '#/components/schemas/RewindCapability'}}}}}
  /playback/options:
    get:
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
        - {name: source_id, in: query, schema: {type: string}}
      description: Source variants of a title and their audio. A VOD file whose source reports no audio tracks is probed once (up to ten seconds, cached for thirty days) so its tracks can be listed.
      responses: {'200': {description: Available source variants and audio evidence, content: {application/json: {schema: {$ref: '#/components/schemas/PlaybackOptions'}}}}}
  /titles/{id}:
    get: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TitleDetail' } } } } } }
  /discover/{section}:
    get:
      summary: Paged metadata discovery independent of available sources
      parameters:
        - {name: section, in: path, required: true, schema: {type: string, enum: [movies, shows]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 1}}
        - {name: sort, in: query, schema: {type: string, enum: [popular, rating, newest], default: popular}}
        - {name: year, in: query, schema: {type: integer, minimum: 1888, maximum: 2100}}
        - {name: language, in: query, schema: {type: string, description: "Availability only; omitted = profile languages; all = all languages."}}
        - {name: source_id, in: query, schema: {type: string, description: "Availability only; never suppresses metadata identities."}}
      responses:
        '200': {description: Metadata page with independently matched availability, content: {application/json: {schema: {$ref: '#/components/schemas/DiscoveryPage'}}}}
        '502': {description: Metadata unavailable or not configured; existing library remains available}

  /browse/{section}:
    get:
      summary: movies | shows | vod | series — paged grid with filters
      parameters:
        - { name: section, in: path, required: true, schema: {type: string} }
        - { name: source_id, in: query, schema: {type: string} }
        - { name: genre, in: query, schema: {type: string, description: "Actual genre metadata; combines with category."} }
        - { name: sort, in: query, schema: {type: string, enum: [added, title, year, rating]} }
        - { name: page, in: query, schema: {type: integer, default: 1} }
        - { name: category, in: query, schema: {type: string, description: "Exact provider category; combines with genre."} }
        - { name: language, in: query, schema: {type: string, description: "Category language hint. Omitted = profile languages; all = all; und = unknown."} }
        - { name: q, in: query, schema: {type: string} }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { tiles: { type: array, items: { $ref: '#/components/schemas/Tile' } }, page: {type: integer}, total: {type: integer}, has_more: {type: boolean}, page_size: {type: integer} } } } } } }

  /browse/{section}/categories:
    get:
      parameters:
        - { name: section, in: path, required: true, schema: {type: string} }
        - { name: source_id, in: query, schema: {type: string} }
        - { name: language, in: query, schema: {type: string} }
        - { name: q, in: query, schema: {type: string} }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: {type: object, required: [name, count], properties: {name: {type: string}, count: {type: integer}}} } } } } }
  /browse/{section}/shelves:
    get:
      summary: Shelves of a section with their first titles, in one call
      description: New Releases first, then by size (a shelf with nothing new in 30 days counts half). Items put titles with a poster first, then newest. Same language, profile policy and adult scope as /browse/{section}.
      parameters:
        - { name: section, in: path, required: true, schema: {type: string} }
        - { name: source_id, in: query, schema: {type: string} }
        - { name: language, in: query, schema: {type: string} }
        - { name: limit_rows, in: query, schema: {type: integer, minimum: 1, maximum: 40, default: 12} }
        - { name: limit_items, in: query, schema: {type: integer, minimum: 1, maximum: 40, default: 20} }
        - { name: include_adult, in: query, schema: {type: boolean, default: false, description: "Admin profile only: also list titles marked adult. Ignored for other profiles."} }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ShelfList' } } } } }
  /browse/{section}/genres:
    get:
      summary: Actual metadata genres with scoped distinct title counts
      parameters:
        - { name: section, in: path, required: true, schema: {type: string} }
        - { name: source_id, in: query, schema: {type: string} }
        - { name: language, in: query, schema: {type: string} }
        - { name: category, in: query, schema: {type: string} }
        - { name: q, in: query, schema: {type: string} }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: {type: object, required: [name, count], properties: {name: {type: string}, count: {type: integer}}} } } } } }
  /browse/{section}/languages:
    get:
      parameters:
        - { name: section, in: path, required: true, schema: {type: string} }
        - { name: source_id, in: query, schema: {type: string} }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: {type: object, required: [code, name, count], properties: {code: {type: string}, name: {type: string}, count: {type: integer}}} } } } } }
  /channels:
    get:
      parameters:
        - { name: country, in: query, schema: {type: string, description: "Country ISO codes CSV from explicit tag or provider group/flag; all or omitted = all; und = unknown. Independent of language."} }
        - { name: source_id, in: query, schema: {type: string} }
        - { name: group, in: query, schema: {type: string} }
        - { name: language, in: query, schema: {type: string, description: "csv ISO 639-3. Omitted = the profile's languages. Present but empty (`language=`) or `all` = all languages (the TV's All chip)."} }
        - { name: favorites, in: query, schema: {type: boolean} }
        - { name: q, in: query, schema: {type: string} }
        - { name: list_id, in: query, schema: {type: string, description: "Re-fetch the exact ordered list returned earlier (e.g. channel_context.list_id) for Up/Down zapping; other filters are ignored. 404 if unknown."} }
        - { name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500} }
        - { name: offset, in: query, schema: {type: integer, minimum: 0, default: 0} }
        - { name: has_epg, in: query, schema: {type: boolean, default: false} }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { list_id: {type: string}, total: {type: integer, nullable: true}, offset: {type: integer}, limit: {type: integer, nullable: true}, channels: { type: array, items: { $ref: '#/components/schemas/Channel' } } } } } } } }
  /channels/groups:
    get:
      parameters:
        - { name: country, in: query, schema: {type: string, description: "Country ISO codes CSV from explicit tag or provider group/flag; all or omitted = all; und = unknown. Independent of language."} }
        - { name: source_id, in: query, schema: {type: string} }
        - { name: language, in: query, schema: {type: string} }
        - { name: q, in: query, schema: {type: string} }
        - { name: favorites, in: query, schema: {type: boolean} }
        - { name: include_hidden, in: query, schema: {type: boolean, default: false} }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChannelGroup' } } } } } }
  /channels/groups/{id}:
    patch: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { type: object, properties: { hidden: {type: boolean}, language_override: {type: string, nullable: true}, sort: {type: integer} } } } } }, responses: { '200': { description: ok } } }
  /channels/languages:
    get: { summary: Languages present with counts, responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { type: object, properties: { code: {type: string}, name: {type: string}, count: {type: integer} } } } } } } } }
  /channels/{id}:
    patch: { summary: User override (number, language, group, epg_id), parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Channel' } } } }, responses: { '200': { description: ok } } }
  /sports/recordings:
    get:
      summary: Explicit sports library videos from Plex; not live or equivalent to IPTV events
      parameters:
        - {in: query, name: language, schema: {type: string}}
        - {in: query, name: sport, schema: {type: string}}
        - {in: query, name: q, schema: {type: string, maxLength: 200}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 40}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Library metadata with normal audio choice required; unknown audio remains honest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SportsRecordingsPage'}
  /sports/events:
    get:
      parameters:
        - {in: query, name: date, schema: {type: string, format: date}}
        - {in: query, name: timezone, schema: {type: string, default: America/New_York}}
        - {in: query, name: status, schema: {type: string, enum: [all, current, upcoming, replay], default: all}}
        - {in: query, name: language, schema: {type: string}}
        - {in: query, name: sport, schema: {type: string}}
        - {in: query, name: q, schema: {type: string, maxLength: 200}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 40}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Events grouped conservatively from provider EPG; current broadcasts do not imply live matches or verified audio.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SportsEventsPage'}
  /sports:
    get:
      tags: [live]
      parameters:
        - {in: query, name: language, schema: {type: string}}
        - {in: query, name: sport, schema: {type: string}}
        - {in: query, name: q, schema: {type: string, maxLength: 200}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 40}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Current sports programme listings; coverage reflects selected languages and visible enabled channels.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SportsPage'}
  /epg:
    get:
      summary: Guide grid
      parameters:
        - { name: country, in: query, schema: {type: string, description: "Country ISO codes CSV from explicit tag or provider group/flag; all or omitted = all; und = unknown. Independent of language."} }
        - { name: channel_ids, in: query, schema: {type: string, description: csv} }
        - { name: from, in: query, schema: {type: string, format: date-time} }
        - { name: to, in: query, schema: {type: string, format: date-time} }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, additionalProperties: { type: array, items: { $ref: '#/components/schemas/Programme' } } } } } } }

  /playback/generation:
    get:
      summary: Authenticated current playback intent generation
      responses:
        '200': {description: ok, content: {application/json: {schema: {type: object, required: [generation], properties: {generation: {type: string}}}}}}
  /playback/recovery:
    get:
      summary: Streamhub-owned playback status (system.manage)
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/PlaybackRecoveryStatus'}}}}
        '403': {description: Admin required}
  /playback/recovery/stop:
    post:
      summary: Stop owned sessions and pause new playback until resumed (system.manage)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlaybackRecoveryConfirmation'}}}}
      responses:
        '200': {description: Stop result including partial failures, content: {application/json: {schema: {$ref: '#/components/schemas/PlaybackRecoveryResult'}}}}
        '403': {description: Admin required}
  /playback/recovery/resume:
    post:
      summary: Allow new playback; old stream tokens remain revoked (system.manage)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlaybackRecoveryConfirmation'}}}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/PlaybackRecoveryStatus'}}}}
        '403': {description: Admin required}
        '409': {description: Owned stop failures remain}
  /playback/multiview:
    post:
      summary: Atomically reserve two distinct new live codec-copy HLS producers before either pane starts
      description: Known provider capacity is required. Capacity one on a shared source rejects both panes. Direct/external, archive, transcoded and DVR playback are unsupported. Grants bind profile, session, source, policy, audio preferences and recovery generation.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MultiviewRequest'}}}}
      responses:
        '200': {description: Both slots reserved; clients may now start the returned panes, content: {application/json: {schema: {$ref: '#/components/schemas/MultiviewDescriptor'}}}}
        '401': {description: Authentication required}
        '403': {description: Authorization or recovery generation changed}
        '409': {description: Capacity unavailable, unsupported mode, or audio selection required}
  /playback/multiview/release:
    post:
      summary: Idempotently release both panes owned by the authenticated profile and session
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MultiviewRelease'}}}}
      responses:
        '204': {description: Both producer slots released after confirmed stop}
        '401': {description: Authentication required}
        '403': {description: Lease belongs to another profile or session}
  /playback/resolve:
    post:
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PlaybackRequest' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PlaybackDescriptor' } } } }
        '409': { description: "user_stream_limit: the user's other devices already play as many streams as their max_streams allows; active lists them, limit is the allowance. Resolving on a device that is already playing never counts that device's own stream: the same title is the same stream (seek, audio change, retry), another title takes its place. Also audio_selection_required and the other playback conflicts.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /playback/progress:
    post:
      description: Besides saving the position, a report keeps the stream counted as playing for the user's stream limit (playing, paused) or releases it at once (stopped).
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ProgressReport' } } } }
      responses: { '204': { description: ok }, '403': {description: Captured profile mismatch or content access denied} }
  /stream/{token}:
    get:
      security: []
      summary: Proxied/remuxed stream (token is short-lived and profile-bound)
      parameters: [{name: token, in: path, required: true, schema: {type: string}}]
      responses:
        '200': { description: stream }
        '403': { description: "remote_access_denied: the user the token was issued to lacks remote.access and the request comes from outside home_networks. content_restricted: the content policy no longer admits it for them." }
        '401': { description: "session_revoked | user_suspended | session_stale: the session, user or user version the token was issued to no longer stands (checked on every request and about every second of a running stream, a positive answer reused for 3 seconds). Resolve playback again." }
        '409': { description: "source_busy: every connection the source allows is in use, or the source refused this one while the others were; active says who is watching what. user_stream_limit: this stream went quiet for 30 seconds or was replaced on its device, and the user's limit is now used by other streams.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /stream/{token}/index.m3u8:
    get:
      security: []
      parameters: [{name: token, in: path, required: true, schema: {type: string}}]
      responses:
        '200': { description: hls playlist }
        '401': { description: "as for /stream/{token}; segments answer the same" }
        '403': { description: "as for /stream/{token}; segments answer the same" }
        '409': { description: "source_busy or user_stream_limit, as for /stream/{token}", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /favorites:
    get: { responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tile' } } } } } } }
    put: { requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Favorite' } } } }, responses: { '204': { description: ok } } }
    delete: { parameters: [{name: kind, in: query, required: true, schema: {type: string}}, {name: id, in: query, required: true, schema: {type: string}}], responses: { '204': { description: ok } } }
  /favorites/reorder:
    post: { requestBody: { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Favorite' } } } } }, responses: { '204': { description: ok } } }
  /watchlist:
    get: { responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tile' } } } } } } }
    put: { requestBody: { content: { application/json: { schema: { type: object, properties: { id: {type: string} } } } } }, responses: { '204': { description: ok } } }
    delete: { parameters: [{name: id, in: query, required: true, schema: {type: string}}], responses: { '204': { description: ok } } }
  /history:
    get: { summary: Recently watched, responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tile' } } } } } } }

  /users:
    get:
      summary: Everyone (users.manage)
      parameters: [{ name: status, in: query, schema: {type: string, enum: [pending, active, suspended]} }]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UserListItem' } } } } } }
    post:
      summary: Add a managed user, one without a Google identity (users.manage)
      requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: {type: string, minLength: 1, maxLength: 64}, avatar: {type: string, nullable: true}, role_id: {type: string, default: family}, pin: {type: string, nullable: true, writeOnly: true, minLength: 4, maxLength: 8} } } } } }
      responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
  /users/{id}:
    get:
      summary: One user with effective access, devices and recent history (users.manage)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } } }
    patch:
      summary: Change a user (users.manage)
      description: >-
        Nobody changes their own role, grants, denials or limits (403 self_edit). Only an owner assigns the
        Owner role, grants users.manage / sources.manage / system.manage, or changes an owner (403
        owner_required). The last active owner cannot be demoted (409 last_owner).
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: {type: string}, avatar: {type: string, nullable: true}, role_id: {type: string}, grants: {type: array, items: {$ref: '#/components/schemas/Permission'}}, denials: {type: array, items: {$ref: '#/components/schemas/Permission'}}, limits: {$ref: '#/components/schemas/LimitsInput'}, on_shared_devices: {type: boolean, nullable: true, description: "null follows the role"}, plex_account_linked: {type: boolean, description: "This user is the owner of the Plex account behind the server's Plex token. At most one user: setting it on one clears it on the others (each change is audited)"} } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } } }
    delete:
      summary: Remove a user and their viewer state (users.manage)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: { '204': { description: removed }, '409': { description: last_owner } }
  /users/{id}/approve:
    post:
      summary: Approve a waiting user with a role (users.manage)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: { content: { application/json: { schema: { type: object, required: [role_id], properties: { role_id: {type: string} } } } } }
      responses: { '200': { description: active, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } }, '409': { description: not_pending } }
  /users/{id}/deny:
    post: { summary: Refuse and remove a waiting user (users.manage), parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '204': { description: removed }, '409': { description: not_pending } } }
  /users/{id}/suspend:
    post: { summary: Suspend an active user; their sessions answer 401 user_suspended (users.manage), parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: suspended, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } }, '409': { description: "last_owner | not_active" } } }
  /users/{id}/reinstate:
    post: { summary: Reinstate a suspended user (users.manage), parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: active, content: { application/json: { schema: { $ref: '#/components/schemas/UserDetail' } } } }, '409': { description: not_suspended } } }
  /users/{id}/pin:
    put:
      summary: Set or clear a user's PIN (one's own; anyone's with users.manage)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: { content: { application/json: { schema: { type: object, properties: { pin: {type: string, nullable: true, writeOnly: true, minLength: 4, maxLength: 8, description: "4 to 8 digits; null clears"} } } } } }
      responses: { '204': { description: ok } }
  /roles:
    get: { summary: Roles with their permissions and limits (users.manage), responses: { '200': { description: built-ins first, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Role' } } } } } } }
    post: { summary: Create a custom role (users.manage), requestBody: { content: { application/json: { schema: { allOf: [{$ref: '#/components/schemas/RoleInput'}], required: [name] } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } } } }
  /roles/{id}:
    patch:
      summary: Edit a role; every member gets the change on their next request (users.manage)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RoleInput' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }, '409': { description: role_fixed (the Owner role) } }
    delete: { summary: Remove a custom role nobody holds (users.manage), parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '204': { description: removed }, '409': { description: "role_builtin | role_in_use" } } }
  /invites:
    get: { summary: "Invites: one's own; all with users.manage (users.invite)", responses: { '200': { description: newest first; never includes a token, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invite' } } } } } } }
    post:
      summary: Create an invite link for a role (users.invite)
      description: The role may be no wider than the inviter's own access, and is never the Owner role (403 invite_role_too_wide).
      requestBody: { content: { application/json: { schema: { type: object, required: [role_id], properties: { role_id: {type: string}, expires_in_hours: {type: integer, minimum: 1, maximum: 720, default: 72}, max_uses: {type: integer, minimum: 1, maximum: 50, default: 1} } } } } }
      responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/InviteCreated' } } } } }
  /invites/{id}:
    delete: { summary: Revoke an invite (its creator; anyone's with users.manage), parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '204': { description: revoked } } }
  /audit:
    get:
      summary: Who changed what about whom, newest first (users.manage)
      parameters:
        - { name: user_id, in: query, schema: {type: string}, description: Entries about or by this user }
        - { name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100} }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } } } } } }

  /themes:
    get: { security: [], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Theme' } } } } } } }
    post: { requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Theme' } } } }, responses: { '201': { description: created } } }
  /settings:
    get: { responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } } } }
    patch: { requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }, responses: { '200': { description: ok } } }
  /settings/tmdb_key:
    put: { requestBody: { content: { application/json: { schema: { type: object, properties: { api_key: {type: string} } } } } }, responses: { '204': { description: ok } } }
  /settings/classification/run:
    post:
      summary: Run one batch of rating lookups now (system.manage)
      description: >-
        A background job looks up TMDB certifications for catalog titles a batch at a time, so a
        user with a rating ceiling is not waiting on first views. This runs the next batch at once.
        Without a TMDB key it does nothing.
      responses:
        '200': { description: what the batch did, content: { application/json: { schema: { type: object, required: [classified, failed, remaining], properties: { classified: {type: integer}, failed: {type: integer}, remaining: {type: integer, description: Titles with a TMDB id still lacking fresh rating evidence} } } } } }
  /settings/request_manager:
    get: { summary: The API key is write-only (system.manage), responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RequestManagerSettings' } } } } } }
    put:
      summary: Seerr-compatible request manager, Overseerr / Jellyseerr / Seerr (system.manage)
      description: Omit api_key to keep the stored key for the same server; a different server or a null url drops it.
      requestBody: { content: { application/json: { schema: { type: object, properties: { url: {type: string, nullable: true}, api_key: {type: string, nullable: true} } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RequestManagerSettings' } } } } }
  /settings/request_manager/test:
    post: { summary: Checks the stored URL and API key (system.manage), responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [ok, message], properties: { ok: {type: boolean}, message: {type: string} } } } } } } }

  /requests:
    get:
      parameters:
        - { name: scope, in: query, schema: {type: string, enum: [mine, all], default: mine, description: "all requires permission to approve"} }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/RequestState' } }
      responses: { '200': { description: newest first, content: { application/json: { schema: { type: object, required: [requests], properties: { requests: { type: array, items: { $ref: '#/components/schemas/MediaRequest' } }, can_approve: {type: boolean, description: "The current profile may approve or decline requests and list scope=all."} } } } } } }
    post:
      summary: Ask for a title no source has
      requestBody: { content: { application/json: { schema: { type: object, required: [media_type, tmdb_id], properties: { media_type: {type: string, enum: [movie, tv]}, tmdb_id: {type: integer}, seasons: {type: array, items: {type: integer}, nullable: true, description: "tv only; omitted = whole series"} } } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/MediaRequest' } } } }
        '200': { description: an open request for this title already exists, content: { application/json: { schema: { $ref: '#/components/schemas/MediaRequest' } } } }
        '409': { description: "already_available | request_manager_unconfigured | metadata_unavailable" }
  /requests/{id}/approve:
    post: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { type: object, properties: { note: {type: string, nullable: true} } } } } }, responses: { '200': { description: approved and, when the request manager accepted it, sent, content: { application/json: { schema: { $ref: '#/components/schemas/MediaRequest' } } } }, '409': { description: already decided } } }
  /requests/{id}/decline:
    post: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { type: object, properties: { note: {type: string, nullable: true} } } } } }, responses: { '200': { description: declined; the requester gets a notice, content: { application/json: { schema: { $ref: '#/components/schemas/MediaRequest' } } } }, '409': { description: already decided } } }
  /notices:
    get: { summary: Notices for the current profile; unread first, responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [notices], properties: { notices: { type: array, items: { $ref: '#/components/schemas/Notice' } } } } } } } } }
  /notices/{id}/read:
    post: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Notice' } } } } } }

  /rooms:
    post:
      summary: Create a watch room for a title or channel
      description: The room starts empty and paused at 0 (a live room starts playing). At most 20 rooms exist at once.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RoomCreate' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '403': { description: "content_restricted, or not allowed to create rooms" }
        '404': { description: unknown title }
        '409': { description: room_limit }
  /rooms/{code}:
    get:
      summary: The join screen (title, host, members, state)
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '403': { description: "content_restricted: the current profile may not watch the room's title" }
        '404': { description: room_not_found }
    delete:
      summary: Close the room (host or administrator)
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      responses: { '204': { description: "closed; connected members receive a closed message with reason deleted" }, '403': { description: not the host }, '404': { description: room_not_found } }
  /rooms/{code}/join:
    post:
      summary: Take a seat in the room
      description: Resolves playback for the current profile exactly as /playback/resolve would; its refusals are returned unchanged, and a member who may not watch the title is refused without disturbing the others. On a source that limits connections the descriptor is a seat on the room's one shared stream (see RoomJoined). Every call adds a member unless the body carries the member_token of a seat the caller already holds, which is then kept. The member starts at the room's position (descriptor.resume_position_ms). A room has at most 8 members and expires after 30 minutes with none.
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RoomJoin' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RoomJoined' } } } }
        '403': { description: "content_restricted and the other /playback/resolve refusals" }
        '404': { description: "room_not_found, or the room's title or variant is not available to this profile" }
        '409': { description: "room_full | room_unsupported | audio_selection_required | user_stream_limit | source_busy (the room's stream could not get a connection of its source; active says who holds them)" }
  /rooms/{code}/descriptor:
    get:
      security: []
      summary: A member's playback descriptor as it is now
      description: >-
        Authorized like the room WebSocket, by the member token in the query (no bearer token). The
        seat is unchanged. In a room that plays one shared stream the descriptor has the playlist URL
        the member already holds (a new one only once that URL's grant has expired or their session
        changed) with the current stream_epoch and start_position_ms; for a title each member plays
        for themselves it is a freshly resolved descriptor. resume_position_ms is the room's position
        now. Resolved for the member's access as it stands now, with the refusals of the join.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: member_token, in: query, required: true, schema: {type: string, maxLength: 2048}}
        - {name: client, in: query, schema: {type: string, enum: [android_tv, web], default: web}}
        - {name: prefer_hls, in: query, schema: {type: boolean, default: false}}
        - {name: recovery_generation, in: query, schema: {type: string, maxLength: 64}, description: "As in PlaybackRequest. Required for web clients."}
        - {name: allow_unverified_audio, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PlaybackDescriptor' } } } }
        '401': { description: "room_unauthorized: not a member token of this room, or expired. session_revoked | user_suspended: the session the seat was taken with no longer stands." }
        '403': { description: "remote_access_denied, a missing rooms.join or watch.* permission, content_restricted and the other /playback/resolve refusals" }
        '404': { description: "room_not_found, or not_a_member: the room dropped this seat (20 s of silence); join again" }
        '409': { description: "as for the join, except room_full" }
  /recordings:
    get:
      summary: The current profile's recordings (everyone's for a holder of users.manage), earliest first
      description: A user under a rating ceiling sees, plays and manages only recordings whose programme was rated within it when it was scheduled.
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/RecordingState' }, description: "omitted = every state except cancelled" }
      responses: { '200': { description: "enabled is false, and the list empty, until the server has a recordings directory", content: { application/json: { schema: { type: object, required: [enabled, recordings], properties: { enabled: {type: boolean}, can_schedule: {type: boolean, description: "The current profile may schedule, cancel and delete."}, recordings: { type: array, items: { $ref: '#/components/schemas/Recording' } } } } } } } }
    post:
      summary: Record one programme
      description: Programme ids change whenever the guide is refreshed. Send channel_id and start as shown on the guide and the server finds the programme by those if the id no longer names it.
      requestBody: { content: { application/json: { schema: { type: object, required: [programme_id], properties: { programme_id: {type: string}, channel_id: {type: string, nullable: true, description: "omitted = the lowest-numbered channel carrying the programme"}, start: {type: string, format: date-time, nullable: true} } } } } }
      responses:
        '201': { description: scheduled, content: { application/json: { schema: { $ref: '#/components/schemas/Recording' } } } }
        '200': { description: this programme was already scheduled, content: { application/json: { schema: { $ref: '#/components/schemas/Recording' } } } }
        '403': { description: recording_forbidden }
        '409': { description: "recording_unavailable | programme_ended | already_scheduled (by another profile) | guide_changed" }
  /recordings/{id}:
    delete: { summary: Cancel an upcoming or running recording; delete a finished one and its file, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '204': { description: ok }, '409': { description: recording_unavailable } } }
  /recording-rules:
    get: { summary: The current profile's rules (everyone's for a holder of users.manage), responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [enabled, rules], properties: { enabled: {type: boolean}, can_schedule: {type: boolean}, rules: { type: array, items: { $ref: '#/components/schemas/RecordingRule' } } } } } } } } }
    post:
      summary: Record every matching programme, now and after each guide refresh
      requestBody: { content: { application/json: { schema: { type: object, required: [kind, match], properties: { kind: {type: string, enum: [series, team, keyword]}, match: {type: string}, channel_id: {type: string, nullable: true}, new_only: {type: boolean, default: false}, keep: {type: integer, nullable: true} } } } } }
      responses:
        '201': { description: created; matching programmes are scheduled at once, content: { application/json: { schema: { $ref: '#/components/schemas/RecordingRule' } } } }
        '200': { description: the profile already has this rule, content: { application/json: { schema: { $ref: '#/components/schemas/RecordingRule' } } } }
        '403': { description: recording_forbidden }
        '409': { description: "recording_unavailable | rule_limit" }
  /recording-rules/{id}:
    patch:
      summary: Edit, disable or enable a rule
      description: Fields left out are kept. Disabling a rule, or changing what it matches, drops the upcoming recordings it scheduled.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: { content: { application/json: { schema: { type: object, properties: { match: {type: string}, channel_id: {type: string, nullable: true}, new_only: {type: boolean}, keep: {type: integer, nullable: true}, enabled: {type: boolean} } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RecordingRule' } } } }, '409': { description: recording_unavailable } }
    delete: { summary: Remove a rule and the upcoming recordings it scheduled; finished ones stay, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '204': { description: ok }, '409': { description: recording_unavailable } } }

  /app/tv:
    get:
      security: []
      summary: The newest TV app build this server hands out
      description: >-
        Read from tv-release.json beside the APK in the web client's downloads directory (format in
        hub-server/README.md). apk_url is a path on this server.
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, required: [version_code, version_name, apk_url, sha256], properties: { version_code: {type: integer}, version_name: {type: string}, apk_url: {type: string, description: "/downloads/<file>"}, sha256: {type: string, description: 64 lower-case hex digits} } } } } }
        '404': { description: No release is published here (no manifest, or an invalid one) }
  /health:
    get: { security: [], responses: { '200': { description: ok } } }
  /about:
    get: { security: [], summary: Version + TMDB/JustWatch attribution strings, responses: { '200': { description: ok } } }
  /qr:
    get:
      security: []
      summary: SVG QR code (TV pairing / Plex link screens)
      parameters: [{ name: data, in: query, required: true, schema: {type: string} }]
      responses: { '200': { description: svg, content: { image/svg+xml: {} } } }
