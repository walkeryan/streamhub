openapi: 3.1.0
info:
  title: StreamHub API
  version: 1.0.0
  description: Unified streaming hub. All clients (Android TV, web) use this contract. Base path /api/v1.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error: { type: object, properties: { code: {type: string}, message: {type: string} }, required: [code, message] }

    AuthTokens:
      type: object
      required: [access_token, refresh_token, profile]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        profile: { $ref: '#/components/schemas/Profile' }
    DeviceCode:
      type: object
      required: [device_code, user_code, expires_in, interval]
      properties:
        device_code: {type: string}
        user_code: {type: string, description: "6-char code shown on TV"}
        expires_in: {type: integer}
        interval: {type: integer}

    Profile:
      type: object
      required: [id, name, is_admin, theme_id, languages, has_pin, kids]
      properties:
        id: {type: string}
        name: {type: string}
        avatar: {type: string, nullable: true}
        is_admin: {type: boolean}
        theme_id: {type: string}
        languages: {type: array, items: {type: string}, description: "ISO 639-3 filter for live TV; empty = all"}
        has_pin: {type: boolean}
        kids: {type: boolean}
        disclaimer_accepted_version: {type: string, nullable: true}

    SourceType: { type: string, enum: [plex, jellyfin, xtream, m3u, streaming_service] }
    Source:
      type: object
      required: [id, type, name, enabled, priority, status]
      properties:
        id: {type: string}
        type: { $ref: '#/components/schemas/SourceType' }
        name: {type: string}
        enabled: {type: boolean}
        priority: {type: integer}
        region: {type: string, description: "ISO 3166-1 alpha-2", default: US}
        status: {type: string, enum: [ok, syncing, error, unauthenticated]}
        last_sync: {type: string, format: date-time, nullable: true}
        counts: { type: object, additionalProperties: {type: integer} }
        service_key: {type: string, nullable: true, description: "for streaming_service: netflix, hulu, …"}
        config_summary: { type: object, additionalProperties: true, description: "never includes secrets" }
    SourceCreate:
      type: object
      required: [type, name, config]
      properties:
        type: { $ref: '#/components/schemas/SourceType' }
        name: {type: string}
        region: {type: string}
        service_key: {type: string, nullable: true}
        config:
          type: object
          description: >
            xtream: {server_url, username, password, output: ts|m3u8} ·
            m3u: {url|file, epg_url?, user_agent?, referer?, refresh_hours} — file is the playlist TEXT
            (uploaded content), persisted server-side under /config/playlists/ ·
            plex: {token?} (use /sources/plex/pin) · jellyfin: {server_url, username?, password?, quick_connect?} ·
            streaming_service: {} (service_key required)
          additionalProperties: true
    PlexPin:
      type: object
      required: [pin_id, code, link_url]
      properties: { pin_id: {type: integer}, code: {type: string}, link_url: {type: string} }

    MediaKind: { type: string, enum: [movie, show, season, episode, channel, vod, series] }
    SourceBadge:
      type: object
      required: [source_id, source_type, name, playable_in_app]
      properties:
        source_id: {type: string}
        source_type: { $ref: '#/components/schemas/SourceType' }
        name: {type: string}
        playable_in_app: {type: boolean}
        kind: {type: string, enum: [library, vod, live, flatrate, free, ads, rent, buy]}
        quality: {type: string, nullable: true}
    Tile:
      type: object
      required: [id, kind, title, sources]
      properties:
        id: {type: string, description: "hub id, e.g. tmdb:movie:603 or ch:<source>:<ext_id>"}
        kind: { $ref: '#/components/schemas/MediaKind' }
        title: {type: string}
        subtitle: {type: string, nullable: true}
        year: {type: integer, nullable: true}
        poster: {type: string, nullable: true}
        backdrop: {type: string, nullable: true}
        logo: {type: string, nullable: true}
        rating: {type: number, nullable: true}
        progress_pct: {type: number, nullable: true}
        is_favorite: {type: boolean, default: false}
        sources: { type: array, items: { $ref: '#/components/schemas/SourceBadge' } }
        now_playing: { $ref: '#/components/schemas/Programme', nullable: true }
    Row:
      type: object
      required: [id, title, tiles]
      properties:
        id: {type: string}
        title: {type: string}
        layout: {type: string, enum: [poster, landscape, hero, channel], default: poster}
        tiles: { type: array, items: { $ref: '#/components/schemas/Tile' } }
    TitleDetail:
      allOf:
        - $ref: '#/components/schemas/Tile'
        - type: object
          properties:
            overview: {type: string}
            genres: {type: array, items: {type: string}}
            runtime_min: {type: integer, nullable: true}
            cast: {type: array, items: {type: object, properties: {name: {type: string}, character: {type: string}, photo: {type: string, nullable: true}}}}
            seasons: { type: array, items: { $ref: '#/components/schemas/Tile' } }
            episodes: { type: array, items: { $ref: '#/components/schemas/Tile' } }
            attribution: {type: string, description: "e.g. 'Availability data by JustWatch'"}

    Channel:
      type: object
      required: [id, source_id, name, number, language, group]
      properties:
        id: {type: string}
        source_id: {type: string}
        ext_id: {type: string}
        number: {type: integer}
        name: {type: string}
        logo: {type: string, nullable: true}
        group: {type: string}
        language: {type: string, description: "ISO 639-3 or 'und'"}
        language_source: {type: string, enum: [tag, db, country, group, flag, name, user]}
        country: {type: string, nullable: true}
        country_source: {type: string, enum: [tag, group, flag], nullable: true, description: "Explicit country tag or conservative provider group/flag hint; missing remains unknown."}
        epg_id: {type: string, nullable: true}
        catchup_days: {type: integer, default: 0}
        is_favorite: {type: boolean}
        now: { $ref: '#/components/schemas/Programme', nullable: true }
        next: { $ref: '#/components/schemas/Programme', nullable: true }
    ChannelGroup:
      type: object
      required: [id, source_id, name, channel_count, hidden]
      properties: { id: {type: string}, source_id: {type: string}, name: {type: string}, channel_count: {type: integer}, hidden: {type: boolean}, language_override: {type: string, nullable: true} }
    Programme:
      type: object
      required: [id, channel_id, start, stop, title]
      properties:
        id: {type: string}
        channel_id: {type: string}
        start: {type: string, format: date-time}
        stop: {type: string, format: date-time}
        title: {type: string}
        description: {type: string, nullable: true}
        category: {type: string, nullable: true}
        icon: {type: string, nullable: true}
        catchup_available: {type: boolean, default: false}

    PlaybackRecoveryStatus:
      type: object
      required: [paused, active_sessions, shared_upstreams, hls_sessions, http_sessions, external_sessions_tracked]
      properties:
        paused: {type: boolean}
        active_sessions: {type: integer, minimum: 0, description: "Owned upstream sessions/requests, not distinct viewers."}
        shared_upstreams: {type: integer, minimum: 0}
        hls_sessions: {type: integer, minimum: 0}
        http_sessions: {type: integer, minimum: 0}
        external_sessions_tracked: {type: boolean, const: false}
    PlaybackRecoveryResult:
      allOf:
        - {$ref: '#/components/schemas/PlaybackRecoveryStatus'}
        - type: object
          required: [stopped, failed, cleanup_failed]
          properties:
            stopped: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            cleanup_failed: {type: integer, minimum: 0}
    PlaybackRecoveryConfirmation:
      type: object
      required: [confirm]
      properties:
        confirm: {type: boolean, const: true}
    PlaybackOption:
      type: object
      required: [variant_id, source_id, source_name, provider_label, audio_languages, audio_verified, audio_evidence, preferred_audio_available]
      properties:
        variant_id: {type: string}
        source_id: {type: string}
        source_name: {type: string}
        provider_label: {type: string}
        kind: {type: string}
        year: {type: integer, nullable: true}
        audio_languages: {type: array, items: {type: string}}
        audio_verified: {type: boolean}
        audio_evidence: {type: string}
        language_hint: {type: string, nullable: true}
        preferred_audio_available: {type: boolean}
    PlaybackOptions:
      type: object
      required: [id, preferred_languages, options, selection_required]
      properties:
        id: {type: string}
        preferred_languages: {type: array, items: {type: string}}
        options: {type: array, items: {$ref: '#/components/schemas/PlaybackOption'}}
        automatic_variant_id: {type: string, nullable: true}
        selection_required: {type: boolean}
    PlaybackRequest:
      type: object
      required: [id]
      properties:
        id: {type: string, description: "tile/channel/programme id, or trailer:<title id> (e.g. trailer:tmdb:movie:603) which returns a mode=handoff descriptor to the YouTube TV app: the specific video (supports_title_link true) when TMDB has a YouTube trailer, otherwise a YouTube search for \"<title> <year> trailer\" (supports_title_link false)"}
        source_id: {type: string, nullable: true, description: "pick a specific source when a title has several"}
        variant_id: {type: string, nullable: true}
        allow_unverified_audio: {type: boolean, default: false}
        client: {type: string, enum: [android_tv, web], default: web}
        prefer_hls: {type: boolean, default: false, description: Prefer HLS remux for live MPEG-TS on web browsers without MPEG-TS playback support.}
        catchup_programme_id: {type: string, nullable: true}
        rewind_at: {type: string, format: date-time, nullable: true, description: "Timezone-aware archive seek on a channel; mutually exclusive with catchup_programme_id."}
        recovery_generation: {type: string, nullable: true, description: "Web playback intent generation, captured once per deliberate Play or Retry and retained across automatic reconnects. Required for web clients."}
    BufferWindow:
      type: object
      required: [mode, buffered_seconds, target_seconds, recording_enabled]
      properties:
        mode: {type: string, enum: [local_buffer]}
        start: {type: string, format: date-time, nullable: true}
        end: {type: string, format: date-time, nullable: true}
        buffered_seconds: {type: number}
        target_seconds: {type: integer}
        recording_enabled: {type: boolean}
    BufferLeaseRequest:
      type: object
      required: [stream_token]
      properties:
        stream_token: {type: string, maxLength: 16384}
    BufferViewerRequest:
      allOf:
        - {$ref: '#/components/schemas/BufferLeaseRequest'}
        - type: object
          required: [lease_id]
          properties:
            lease_id: {type: string, maxLength: 128}
            paused: {type: boolean, default: false}
    BufferSeekRequest:
      allOf:
        - {$ref: '#/components/schemas/BufferViewerRequest'}
        - type: object
          properties:
            at: {type: string, format: date-time, nullable: true}
    BufferLeaseResponse:
      type: object
      required: [lease_id, session_id, window]
      properties:
        lease_id: {type: string}
        session_id: {type: string}
        window: {$ref: '#/components/schemas/BufferWindow'}
    BufferSeekResponse:
      type: object
      required: [url, window]
      properties:
        url: {type: string}
        window: {$ref: '#/components/schemas/BufferWindow'}
    RewindCapability:
      type: object
      required: [mode, verified, recording_enabled, granularity_seconds, reason]
      properties:
        mode: {type: string, enum: [provider_archive, unavailable]}
        advertised_start: {type: string, format: date-time, nullable: true}
        advertised_end: {type: string, format: date-time, nullable: true}
        verified: {type: boolean}
        recording_enabled: {type: boolean}
        granularity_seconds: {type: integer}
        reason: {type: string}
    PlaybackDescriptor:
      type: object
      required: [mode, id]
      properties:
        id: {type: string}
        mode: {type: string, enum: [direct, proxy, hls, handoff]}
        url: {type: string, nullable: true}
        mime: {type: string, nullable: true, description: "video/mp2t, application/x-mpegURL, video/mp4, application/dash+xml"}
        headers: { type: object, additionalProperties: {type: string} }
        live: {type: boolean, default: false}
        buffer_available: {type: boolean, default: false}
        archive_start: {type: string, format: date-time, nullable: true}
        archive_end: {type: string, format: date-time, nullable: true}
        resume_position_ms: {type: integer, default: 0}
        duration_ms: {type: integer, nullable: true}
        title: {type: string}
        subtitle: {type: string, nullable: true}
        poster: {type: string, nullable: true}
        channel_context:
          type: object
          nullable: true
          description: "for live: allow channel up/down within this ordered list"
          properties: { list_id: {type: string}, index: {type: integer}, count: {type: integer} }
        handoff:
          type: object
          nullable: true
          properties:
            service_key: {type: string}
            android_package: {type: string}
            android_uri: {type: string, nullable: true}
            android_component: {type: string, nullable: true, description: "Explicit activity as package/.Class (e.g. com.hulu.livingroomplus/.WKFactivity); null = use the package's leanback launch/VIEW intent"}
            android_extras: { type: object, additionalProperties: {type: string} }
            web_url: {type: string}
            supports_title_link: {type: boolean}
    ProgressReport:
      type: object
      description: >
        Sent every 10 s while playing and on pause/stop (ordinary bearer-auth POST).
        state=stopped with position_ms >= duration_ms marks the item watched (resume resets to 0);
        position >= 95% of duration also counts as watched.
      required: [id, position_ms, state]
      properties:
        id: {type: string}
        source_id: {type: string, nullable: true}
        position_ms: {type: integer}
        duration_ms: {type: integer, nullable: true}
        state: {type: string, enum: [playing, paused, stopped]}

    ServiceInfo:
      type: object
      required: [service_key, name, web_url, supports_title_link, tmdb_provider_ids]
      properties:
        service_key: {type: string}
        name: {type: string}
        android_package: {type: string, nullable: true}
        android_component: {type: string, nullable: true, description: "package/.Class, e.g. com.hulu.livingroomplus/.WKFactivity"}
        android_title_uri_template: {type: string, nullable: true, description: "VIEW-intent URI with {placeholders} (e.g. {netflix_id}); null when unknown. Clients normally use handoff from /playback/resolve."}
        web_url: {type: string}
        supports_title_link: {type: boolean}
        tmdb_provider_ids: {type: array, items: {type: integer}}
    ClientPrefs:
      type: object
      additionalProperties: true
      description: "Opaque client-owned preferences. Max 16 KB when serialized."
    HomeLayout:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          description: "Row ids: continue_watching, on_now, recently_added, watchlist, favorites, trending, source:<id>. Ordered by sort."
          items:
            type: object
            required: [id]
            properties: { id: {type: string}, hidden: {type: boolean, default: false}, sort: {type: integer} }
    Favorite:
      type: object
      required: [kind, id]
      properties: { kind: { $ref: '#/components/schemas/MediaKind' }, id: {type: string}, sort: {type: integer} }
    Theme:
      type: object
      required: [id, name, tokens]
      properties: { id: {type: string}, name: {type: string}, builtin: {type: boolean}, tokens: {type: object, additionalProperties: true} }
    Settings:
      type: object
      properties:
        tmdb_api_key_set: {type: boolean}
        region: {type: string}
        sleep_timer_min: {type: integer, nullable: true}
        epg_refresh_hours: {type: integer}
        transcode_hw: {type: string, enum: [none, vaapi, nvenc, qsv]}
        proxy_mode: {type: string, enum: [auto, always, never]}
    Disclaimer:
      type: object
      required: [version, text]
      properties: { version: {type: string}, text: {type: string} }

    SportsListing:
      type: object
      required: [id, sport, programme_id, title, start, stop, channel_id, channel_name, channel_number, source_name]
      properties:
        id: {type: string}
        sport: {type: string}
        programme_id: {type: string}
        title: {type: string}
        category: {type: string, nullable: true}
        start: {type: string, format: date-time}
        stop: {type: string, format: date-time}
        channel_id: {type: string}
        channel_name: {type: string}
        channel_number: {type: integer}
        source_name: {type: string}
    SportsPage:
      type: object
      required: [as_of, items, total, limit, offset, sports, coverage]
      properties:
        as_of: {type: string, format: date-time}
        items: {type: array, items: {$ref: '#/components/schemas/SportsListing'}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        sports:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: {type: string}
              count: {type: integer}
        coverage:
          type: object
          required: [eligible_channels, channels_with_current_schedule]
          properties:
            eligible_channels: {type: integer}
            channels_with_current_schedule: {type: integer}

    SportsEventFeed:
      type: object
      required: [channel_id, channel_name, source_id, source_name, programme_id, language_verified]
      properties:
        channel_id: {type: string}
        channel_name: {type: string}
        source_id: {type: string}
        source_name: {type: string}
        programme_id: {type: string}
        language: {type: string, nullable: true}
        language_verified: {type: boolean}
    SportsEvent:
      type: object
      required: [id, title, sport, start, stop, status, replay, live_evidence, grouping_evidence, feeds]
      properties:
        id: {type: string}
        title: {type: string}
        sport: {type: string}
        start: {type: string, format: date-time}
        stop: {type: string, format: date-time}
        status: {type: string, enum: [current, upcoming, ended]}
        replay: {type: boolean}
        live_evidence: {type: boolean}
        grouping_evidence: {type: string}
        feeds: {type: array, items: {$ref: '#/components/schemas/SportsEventFeed'}}
    SportsEventsPage:
      type: object
      required: [as_of, date, timezone, events, total, limit, offset, sports, coverage, truncated]
      properties:
        as_of: {type: string, format: date-time}
        date: {type: string}
        timezone: {type: string}
        events: {type: array, items: {$ref: '#/components/schemas/SportsEvent'}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        truncated: {type: boolean}
        sports:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: {type: string}
              count: {type: integer}
        coverage:
          type: object
          required: [eligible_channels, channels_with_sports_schedule]
          properties:
            eligible_channels: {type: integer}
            channels_with_sports_schedule: {type: integer}

paths:
  /auth/login:
    post:
      security: []
      summary: Profile login (password for admin, PIN for profiles)
      requestBody: { content: { application/json: { schema: { type: object, required: [profile_id], properties: { profile_id: {type: string}, pin: {type: string, nullable: true}, password: {type: string, nullable: true} } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } } }
  /auth/refresh:
    post: { security: [], requestBody: { content: { application/json: { schema: { type: object, properties: { refresh_token: {type: string} } } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } } } }
  /auth/device:
    post: { security: [], summary: TV starts pairing; shows user_code, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceCode' } } } } } }
  /auth/device/poll:
    post: { security: [], requestBody: { content: { application/json: { schema: { type: object, properties: { device_code: {type: string} } } } } }, responses: { '200': { description: approved, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }, '428': { description: pending } } }
  /auth/device/approve:
    post: { summary: Logged-in user approves a TV code (web), requestBody: { content: { application/json: { schema: { type: object, properties: { user_code: {type: string}, profile_id: {type: string} } } } } }, responses: { '204': { description: ok } } }

  /profiles:
    get: { security: [], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Profile' } } } } } } }
    post: { requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, responses: { '201': { description: created } } }
  /profiles/{id}:
    patch: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, responses: { '200': { description: ok } } }
    delete: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '204': { description: ok } } }
  /profiles/{id}/pin:
    put: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { type: object, properties: { pin: {type: string, nullable: true} } } } } }, responses: { '204': { description: ok } } }

  /profiles/{id}/home_layout:
    get: { summary: Per-profile Home row order / hidden rows, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/HomeLayout' } } } } } }
    put: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/HomeLayout' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/HomeLayout' } } } } } }

  /profiles/{id}/prefs:
    get: { summary: Free-form client prefs for a profile (recent searches, reduced motion…), parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: "JSON object ({} when unset)", content: { application/json: { schema: { $ref: '#/components/schemas/ClientPrefs' } } } } } }
    put: { summary: Replace the profile's client prefs (JSON object, max 16 KB serialized; 413 payload_too_large otherwise), parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientPrefs' } } } }, responses: { '200': { description: stored object, content: { application/json: { schema: { $ref: '#/components/schemas/ClientPrefs' } } } }, '413': { description: too large } } }

  /disclaimer:
    get: { security: [], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Disclaimer' } } } } } }
  /disclaimer/accept:
    post: { requestBody: { content: { application/json: { schema: { type: object, properties: { version: {type: string} } } } } }, responses: { '204': { description: ok } } }

  /sources:
    get: { responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Source' } } } } } } }
    post:
      description: Rejected with 412 if the disclaimer has not been accepted and type is xtream or m3u.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SourceCreate' } } } }
      responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }, '412': { description: disclaimer not accepted } }
  /sources/{id}:
    get: { parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } } } }
