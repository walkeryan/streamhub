openapi: 3.1.0
info:
  title: StreamHub API
  version: 1.0.0
  description: >-
    Unified streaming hub. All clients (Android TV, web) use this contract. Base path /api/v1.
    A user without the remote.access permission is served on the home network only (the
    home_networks setting): from anywhere else every authenticated call answers 403
    remote_access_denied, except GET /auth/me. The signed media URLs follow the user they were
    issued to: /stream/{token}... and, for artwork the hub serves itself, /images/{token} answer
    the same 403 away from home.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        active: {type: array, items: {$ref: '#/components/schemas/ActiveStream'}, description: "On source_busy: the streams this server is running on the source, longest-running first; may be empty when something outside this server holds the connections. On user_stream_limit: the user's own streams that use up their limit."}
        limit: {type: integer, nullable: true, description: "On source_busy: how many connections the source allows, when known. On user_stream_limit: the user's max_streams."}
        missing: {type: array, items: {$ref: '#/components/schemas/Permission'}, description: "403 forbidden only: the permissions the caller lacks"}
    ActiveStream:
      type: object
      description: One stream holding a source connection, named to the profile a busy source turned away; or one of a user's own streams, on user_stream_limit.
      properties:
        profile_name: {type: string, nullable: true}
        title: {type: string, nullable: true, description: "Channel or title being watched; null for adult titles and for content the refused profile may not open. A watch room's shared stream is named \"Watch room: <title>\" (profile_name is the host), a recording on a connection of its own \"Recording: <title>\"."}
        kind: {type: string, nullable: true, description: "channel, movie, episode, …; null whenever title is."}
        since: {type: string, format: date-time, description: When this stream's connection was opened.}

    Permission:
      type: string
      enum: [watch.library, watch.vod, watch.live, watch.adult, rooms.join, rooms.create, recordings.view, recordings.schedule, requests.create, requests.auto_approve, requests.approve, remote.access, users.invite, users.manage, sources.manage, system.manage]
    Limits:
      type: object
      required: [max_streams, rating_ceiling_movie, rating_ceiling_tv, allow_unrated]
      properties:
        max_streams: {type: integer, nullable: true, description: "Concurrent streams; null = no limit"}
        rating_ceiling_movie: {type: string, nullable: true, enum: [G, PG, PG-13, R, NC-17, null]}
        rating_ceiling_tv: {type: string, nullable: true, enum: [TV-Y, TV-Y7, TV-G, TV-PG, TV-14, TV-MA, null]}
        allow_unrated: {type: boolean}
    LimitsInput:
      type: object
      additionalProperties: false
      description: Only the fields present are set. Null lifts that limit; on a user an empty object clears every override.
      properties:
        max_streams: {type: integer, nullable: true, minimum: 1, maximum: 100}
        rating_ceiling_movie: {type: string, nullable: true}
        rating_ceiling_tv: {type: string, nullable: true}
        allow_unrated: {type: boolean}
    RoleRef:
      type: object
      required: [id, name, builtin]
      properties: { id: {type: string}, name: {type: string}, builtin: {type: boolean} }
    Role:
      type: object
      required: [id, name, builtin, editable, permissions, limits, on_shared_devices, user_count, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        builtin: {type: boolean}
        editable: {type: boolean, description: False for the Owner role}
        permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        limits: {$ref: '#/components/schemas/Limits'}
        on_shared_devices: {type: boolean, description: Users with this role appear in the picker on shared household devices}
        user_count: {type: integer}
        updated_at: {type: string, format: date-time}
    RoleInput:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        limits: {$ref: '#/components/schemas/LimitsInput'}
        on_shared_devices: {type: boolean}
    User:
      type: object
      required: [id, kind, display_name, status, created_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [google, managed]}
        display_name: {type: string}
        email: {type: string, nullable: true}
        picture: {type: string, nullable: true}
        avatar: {type: string, nullable: true}
        status: {type: string, enum: [pending, active, suspended]}
        role_id: {type: string, nullable: true, description: Null while pending}
        role_name: {type: string, nullable: true}
        profile_id: {type: string, nullable: true, description: The profile holding this user's viewer state}
        has_pin: {type: boolean}
        on_shared_devices: {type: boolean}
        plex_account_linked: {type: boolean, description: "This user is the person the Plex server's account belongs to. Their resume points and Plex's are merged when a title is opened or resolved (the one touched last wins; watched in Plex means completed), and only their progress is reported to Plex. Nobody else's requests read or write Plex's watch state."}
        created_at: {type: string, format: date-time}
        approved_at: {type: string, format: date-time, nullable: true}
        last_seen_at: {type: string, format: date-time, nullable: true}
    NowPlaying:
      type: object
      required: [id]
      additionalProperties: true
      description: One stream a user is playing. Listed while it shows activity - bytes or a segment served, or a progress report, in the last 30 seconds - and for 30 seconds after it was resolved.
      properties:
        id: {type: string, description: The id that was resolved}
        title: {type: string, nullable: true, description: null for adult titles}
        kind: {type: string, nullable: true, description: "channel, movie, episode, recording, …"}
        since: {type: string, format: date-time}
        client: {type: string, nullable: true, enum: [web, android_tv, null]}
    UserListItem:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [now_playing]
          properties:
            now_playing: {type: array, items: {$ref: '#/components/schemas/NowPlaying'}}
    AuthSession:
      type: object
      required: [sid, user_id, kind, shared_device, created_at, last_seen_at, current]
      properties:
        sid: {type: string}
        user_id: {type: string}
        kind: {type: string, enum: [browser, tv, api]}
        label: {type: string, nullable: true}
        user_agent: {type: string, nullable: true}
        ip: {type: string, nullable: true}
        shared_device: {type: boolean}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        current: {type: boolean, description: The session making this request}
    SwitchableUser:
      type: object
      required: [id, display_name, avatar, picture, role_name, has_pin, current]
      properties:
        id: {type: string}
        display_name: {type: string}
        avatar: {type: string, nullable: true}
        picture: {type: string, nullable: true}
        role_name: {type: string}
        has_pin: {type: boolean}
        current: {type: boolean, description: The user this device is signed in as}
    Switched:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [user]
          properties:
            user:
              description: The user now on the device. Every field of a picker entry and of /auth/me's user.
              allOf:
                - $ref: '#/components/schemas/User'
                - type: object
                  required: [current]
                  properties:
                    current: {type: boolean, enum: [true]}
    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserListItem'
        - type: object
          required: [grants, denials, limit_overrides, permissions, limits, sessions, history]
          properties:
            grants: {type: array, items: {$ref: '#/components/schemas/Permission'}}
            denials: {type: array, items: {$ref: '#/components/schemas/Permission'}}
            limit_overrides: {type: object, additionalProperties: true}
            on_shared_devices_override: {type: boolean, nullable: true}
            permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}, description: Effective set}
            limits: {$ref: '#/components/schemas/Limits'}
            sessions: {type: array, items: {$ref: '#/components/schemas/AuthSession'}}
            history:
              type: array
              items:
                type: object
                required: [ref_id, position_ms, completed, updated_at]
                properties:
                  ref_id: {type: string}
                  kind: {type: string, nullable: true}
                  position_ms: {type: integer}
                  duration_ms: {type: integer, nullable: true}
                  completed: {type: boolean}
                  updated_at: {type: string, format: date-time}
    Me:
      type: object
      required: [status, user, role, permissions, limits, shared_device, adult_unlocked, tokens]
      properties:
        status: {type: string, enum: [pending, active, suspended]}
        user: {$ref: '#/components/schemas/User'}
        role: {allOf: [{$ref: '#/components/schemas/RoleRef'}], nullable: true}
        permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        limits: {$ref: '#/components/schemas/Limits'}
        shared_device: {type: boolean}
        adult_unlocked: {type: boolean}
        tokens: {allOf: [{$ref: '#/components/schemas/AuthTokens'}], nullable: true, description: "Set once: when a user who was waiting for approval has been approved"}
    PendingApproval:
      type: object
      required: [status, pending_token, user]
      properties:
        status: {type: string, enum: [pending]}
        pending_token: {type: string, description: Authorizes GET /auth/me and nothing else}
        user: {type: object, properties: {display_name: {type: string}, email: {type: string, nullable: true}}}
    Invite:
      type: object
      required: [id, role_id, created_at, expires_at, max_uses, uses, state]
      properties:
        id: {type: string}
        role_id: {type: string}
        role_name: {type: string, nullable: true}
        created_by_user_id: {type: string, nullable: true}
        created_by_name: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        max_uses: {type: integer}
        uses: {type: integer}
        state: {type: string, enum: [open, used, expired, revoked]}
    InviteCreated:
      allOf:
        - $ref: '#/components/schemas/Invite'
        - type: object
          required: [url]
          properties:
            url: {type: string, description: "/invite/<token>. The token is shown this once and stored only as a hash."}
    AuditEntry:
      type: object
      required: [id, at, action, detail]
      properties:
        id: {type: integer}
        at: {type: string, format: date-time}
        action: {type: string, description: "user.approve, user.role_change, user.suspend, role.update, invite.create, session.revoke, session.switch, session.update, ..."}
        actor_user_id: {type: string, nullable: true}
        actor_name: {type: string, nullable: true}
        target_user_id: {type: string, nullable: true}
        target_name: {type: string, nullable: true}
        detail: {type: object, additionalProperties: true}

    AuthTokens:
      type: object
      required: [access_token, refresh_token, profile]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        profile: { $ref: '#/components/schemas/Profile' }
    PendingOwnerLogin:
      type: object
      required: [owner_pin_required, pending_token, profile]
      properties:
        owner_pin_required: {type: boolean, enum: [true]}
        pending_token: {type: string, description: Memory-only pending Google capability; not an owner JWT}
        profile: {$ref: '#/components/schemas/Profile'}
        setup_required: {type: boolean}
    OwnerPinChallenge:
      type: object
      required: [challenge_id, poll_token, expires_in]
      properties:
        challenge_id: {type: string}
        poll_token: {type: string, description: Keep only in memory}
        expires_in: {type: integer}
    OwnerActionProof:
      type: object
      required: [owner_action_token, profile_id, action, expires_in]
      properties:
        owner_action_token: {type: string, description: One-use proof; send only as X-Owner-Action for the bound target}
        profile_id: {type: string}
        action: {type: string, enum: [content_policy]}
        expires_in: {type: integer}
    OwnerPinSetupStatus:
      type: object
      required: [configured, local_approval_required, setup_authorized]
      properties:
        configured: {type: boolean}
        local_approval_required: {type: boolean}
        setup_authorized: {type: boolean}
        setup_request_id: {type: string, description: Nonsecret local approval request identifier}
        grant_id: {type: string}
        grant_secret: {type: string, description: Keep only in memory; never display or persist}
    ContentPolicy:
      type: object
      required: [profile_id, feature_enabled, restricted, allowed_movie_codes, allowed_tv_codes, allow_unknown]
      properties:
        profile_id: {type: string}
        feature_enabled: {type: boolean}
        restricted: {type: boolean}
        allowed_movie_codes: {type: array, items: {type: string}}
        allowed_tv_codes: {type: array, items: {type: string}}
        allow_unknown: {type: boolean, default: false}
    ContentPolicyInput:
      type: object
      required: [restricted, allowed_movie_codes, allowed_tv_codes, allow_unknown]
      properties:
        restricted: {type: boolean}
        allowed_movie_codes: {type: array, items: {type: string}}
        allowed_tv_codes: {type: array, items: {type: string}}
        allow_unknown: {type: boolean, default: false}
    DeviceCode:
      type: object
      required: [device_code, user_code, expires_in, interval]
      properties:
        device_code: {type: string}
        user_code: {type: string, description: "6-char code shown on TV"}
        expires_in: {type: integer}
        interval: {type: integer}

    Profile:
      type: object
      required: [id, name, is_admin, theme_id, languages, has_pin, kids]
      properties:
        id: {type: string}
        name: {type: string}
        avatar: {type: string, nullable: true}
        is_admin: {type: boolean}
        theme_id: {type: string}
        languages: {type: array, items: {type: string}, description: "ISO 639-3 filter for live TV; empty = all"}
        has_pin: {type: boolean}
        has_password: {type: boolean, description: Existing password credential available. Missing means unavailable.}
        content_restricted: {type: boolean, description: Server policy currently restricts this profile.}
        kids: {type: boolean}
        disclaimer_accepted_version: {type: string, nullable: true}

    SourceType: { type: string, enum: [plex, jellyfin, xtream, m3u, streaming_service] }
    Source:
      type: object
      required: [id, type, name, enabled, priority, status]
      properties:
        id: {type: string}
        type: { $ref: '#/components/schemas/SourceType' }
        name: {type: string}
        enabled: {type: boolean}
        priority: {type: integer}
        region: {type: string, description: "ISO 3166-1 alpha-2", default: US}
        status: {type: string, enum: [ok, syncing, error, unauthenticated]}
        last_sync: {type: string, format: date-time, nullable: true}
        counts: { type: object, additionalProperties: {type: integer} }
        service_key: {type: string, nullable: true, description: "for streaming_service: netflix, hulu, …"}
        config_summary: { type: object, additionalProperties: true, description: "never includes secrets" }
    SourceCreate:
      type: object
      required: [type, name, config]
      properties:
        type: { $ref: '#/components/schemas/SourceType' }
        name: {type: string}
        region: {type: string}
        service_key: {type: string, nullable: true}
        config:
          type: object
          description: >
            xtream: {server_url, username, password, output: ts|m3u8} ·
            m3u: {url|file, epg_url?, user_agent?, referer?, refresh_hours} — file is the playlist TEXT
            (uploaded content), persisted server-side under /config/playlists/ ·
            plex: {token?} (use /sources/plex/pin) · jellyfin: {server_url, username?, password?, quick_connect?} ·
            streaming_service: {} (service_key required)
          additionalProperties: true
    PlexPin:
      type: object
      required: [pin_id, code, link_url]
      properties: { pin_id: {type: integer}, code: {type: string}, link_url: {type: string} }

    MediaKind: { type: string, enum: [movie, show, season, episode, channel, vod, series] }
    SourceBadge:
      type: object
      required: [source_id, source_type, name, playable_in_app]
      properties:
        source_id: {type: string}
        source_type: { $ref: '#/components/schemas/SourceType' }
        name: {type: string}
        playable_in_app: {type: boolean}
        kind: {type: string, enum: [library, vod, live, flatrate, free, ads, rent, buy]}
        quality: {type: string, nullable: true}
    Tile:
      type: object
      required: [id, kind, title, sources]
      properties:
        id: {type: string, description: "hub id, e.g. tmdb:movie:603 or ch:<source>:<ext_id>"}
        kind: { $ref: '#/components/schemas/MediaKind' }
        title: {type: string}
        subtitle: {type: string, nullable: true}
        year: {type: integer, nullable: true}
        poster: {type: string, nullable: true}
        backdrop: {type: string, nullable: true}
        logo: {type: string, nullable: true}
        rating: {type: number, nullable: true}
        progress_pct: {type: number, nullable: true}
        is_favorite: {type: boolean, default: false}
        sources: { type: array, items: { $ref: '#/components/schemas/SourceBadge' } }
        now_playing: { $ref: '#/components/schemas/Programme', nullable: true }
        request_state: { oneOf: [{ $ref: '#/components/schemas/RequestState' }, { type: 'null' }], description: "Open request for this title, else its most recent closed one; null when never requested." }
        requestable: {type: boolean, description: "TMDB-identified, no in-app source, a request manager is configured and the profile may request. Independent of request_state: show the state instead while a request is open."}
    Row:
      type: object
      required: [id, title, tiles]
      properties:
        id: {type: string}
        title: {type: string}
        layout: {type: string, enum: [poster, landscape, hero, channel], default: poster}
        tiles: { type: array, items: { $ref: '#/components/schemas/Tile' } }
        browse_path: {type: string, nullable: true, description: "Client route for the row's \"See all\" (a shelf row: /browse/{section}?category=...). Null when the row has no fuller listing."}
    Shelf:
      type: object
      required: [name, count, items, browse_path]
      properties:
        name: {type: string, description: "Category name computed at sync, e.g. New Releases."}
        count: {type: integer, description: "Distinct titles on the shelf for this profile, language and adult scope."}
        items: { type: array, items: { $ref: '#/components/schemas/Tile' } }
        browse_path: {type: string, description: "Client route listing the whole shelf."}
    ShelfList:
      type: object
      required: [shelves]
      properties:
        shelves: { type: array, items: { $ref: '#/components/schemas/Shelf' } }
    TitleDetail:
      allOf:
        - $ref: '#/components/schemas/Tile'
        - type: object
          properties:
            overview: {type: string}
            genres: {type: array, items: {type: string}}
            runtime_min: {type: integer, nullable: true}
            cast: {type: array, items: {type: object, properties: {name: {type: string}, character: {type: string}, photo: {type: string, nullable: true}}}}
            seasons: { type: array, items: { $ref: '#/components/schemas/Tile' } }
            episodes: { type: array, items: { $ref: '#/components/schemas/Tile' } }
            attribution: {type: string, description: "e.g. 'Availability data by JustWatch'"}
            request_seasons: {type: array, items: {type: integer}, description: "Requestable series only: season numbers a request may pick from (empty = whole series only)."}

    DiscoveryPage:
      type: object
      required: [tiles, page, page_size, total, has_more, coverage_note]
      properties:
        tiles: {type: array, items: {$ref: '#/components/schemas/Tile'}}
        page: {type: integer}
        page_size: {type: integer, default: 20}
        total: {type: [integer, 'null'], description: "Metadata-provider total; null for restricted profiles, never a count of playable sources."}
        has_more: {type: boolean}
        coverage_note: {type: string}

    Channel:
      type: object
      required: [id, source_id, name, number, language, group]
      properties:
        id: {type: string}
        source_id: {type: string}
        ext_id: {type: string}
        number: {type: integer}
        name: {type: string}
        logo: {type: string, nullable: true}
        group: {type: string}
        language: {type: string, description: "ISO 639-3 or 'und'"}
        language_source: {type: string, enum: [tag, db, country, group, flag, name, user]}
        country: {type: string, nullable: true}
        country_source: {type: string, enum: [tag, group, flag], nullable: true, description: "Explicit country tag or conservative provider group/flag hint; missing remains unknown."}
        epg_id: {type: string, nullable: true}
        catchup_days: {type: integer, default: 0}
        is_favorite: {type: boolean}
        now: { $ref: '#/components/schemas/Programme', nullable: true }
        next: { $ref: '#/components/schemas/Programme', nullable: true }
    ChannelGroup:
      type: object
      required: [id, source_id, name, channel_count, hidden]
      properties: { id: {type: string}, source_id: {type: string}, name: {type: string}, channel_count: {type: integer}, hidden: {type: boolean}, language_override: {type: string, nullable: true} }
    Programme:
      type: object
      required: [id, channel_id, start, stop, title]
      properties:
        id: {type: string}
        channel_id: {type: string}
        start: {type: string, format: date-time}
        stop: {type: string, format: date-time}
        title: {type: string}
        description: {type: string, nullable: true}
        category: {type: string, nullable: true}
        icon: {type: string, nullable: true}
        catchup_available: {type: boolean, default: false}
        is_sport: {type: boolean, description: "Always sent. The server's sports classifier says this listing is sport (from its title and category); the classifier behind /sports/now and the recorder."}
        teams: {type: array, items: {type: string}, description: "The two sides, in title order, when is_sport and the title spells out a matchup (A vs B, A v B, A versus B, A at B, A @ B; a league prefix and trailing notes are dropped). Empty otherwise: nothing is guessed."}
        recording_state: { oneOf: [{ $ref: '#/components/schemas/RecordingState' }, { type: 'null' }], description: "State of the household's recording of this programme, if there is one. Null when recording is off." }

    PlaybackRecoveryStatus:
      type: object
      required: [paused, active_sessions, shared_upstreams, hls_sessions, http_sessions, external_sessions_tracked]
      properties:
        paused: {type: boolean}
        active_sessions: {type: integer, minimum: 0, description: "Owned upstream sessions/requests, not distinct viewers."}
        shared_upstreams: {type: integer, minimum: 0}
        hls_sessions: {type: integer, minimum: 0}
        http_sessions: {type: integer, minimum: 0}
        pair_reservations: {type: integer, minimum: 0, description: Active or pending atomic multiview leases; each reserves two producers.}
        external_sessions_tracked: {type: boolean, const: false}
    PlaybackRecoveryResult:
      allOf:
        - {$ref: '#/components/schemas/PlaybackRecoveryStatus'}
        - type: object
          required: [stopped, failed, cleanup_failed]
          properties:
            stopped: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            cleanup_failed: {type: integer, minimum: 0}
    PlaybackRecoveryConfirmation:
      type: object
      required: [confirm]
      properties:
        confirm: {type: boolean, const: true}
    AudioTrack:
      type: object
      description: One audio stream of a VOD file, read from the file itself by a media probe.
      required: [index]
      properties:
        index: {type: integer, description: Position among the file's audio streams; the value to send as audio_track.}
        language: {type: string, default: und, description: ISO 639-2 code, or und when the file does not say.}
        codec: {type: string, nullable: true, description: "ffmpeg codec name, e.g. ac3, eac3, aac, dts"}
        channels: {type: integer, nullable: true}
        title: {type: string, nullable: true}
        default: {type: boolean, default: false}
    PlaybackOption:
      type: object
      required: [variant_id, source_id, source_name, provider_label, audio_languages, audio_verified, audio_evidence, preferred_audio_available]
      properties:
        variant_id: {type: string}
        source_id: {type: string}
        source_name: {type: string}
        provider_label: {type: string}
        kind: {type: string}
        year: {type: integer, nullable: true}
        audio_languages: {type: array, items: {type: string}}
